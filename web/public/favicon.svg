<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="iconGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Rounded App Icon Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#iconBg)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Server Tab Stack (Back layer) -->
  <rect x="120" y="90" width="272" height="130" rx="28" fill="#111c35" stroke="#1e293b" stroke-width="4"/>
  <circle cx="160" cy="120" r="10" fill="#ef4444"/>
  <circle cx="195" cy="120" r="10" fill="#f59e0b"/>
  <circle cx="230" cy="120" r="10" fill="#10b981"/>

  <!-- Gamepad Controller Body (Foreground) -->
  <path d="M 110 200 
           C 95 200, 70 240, 80 320 
           C 85 375, 120 410, 168 410 
           C 200 410, 224 380, 256 364 
           C 288 380, 312 410, 344 410 
           C 392 410, 427 375, 432 320 
           C 442 240, 417 200, 402 200 
           C 370 200, 336 224, 256 224 
           C 176 224, 142 200, 110 200 Z" 
        fill="#0b1424" stroke="url(#neonCyan)" stroke-width="10" filter="url(#iconGlow)"/>

  <!-- D-Pad (Left side) -->
  <g transform="translate(136, 260)">
    <rect x="30" y="0" width="30" height="90" rx="10" fill="#1e2d4d" stroke="#38bdf8" stroke-width="4"/>
    <rect x="0" y="30" width="90" height="30" rx="10" fill="#1e2d4d" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="45" cy="45" r="9" fill="#38bdf8"/>
  </g>

  <!-- Action Buttons (Right side) -->
  <g transform="translate(316, 260)">
    <circle cx="45" cy="15" r="14" fill="#10b981" filter="url(#iconGlow)"/>
    <circle cx="15" cy="45" r="14" fill="#38bdf8"/>
    <circle cx="75" cy="45" r="14" fill="#f59e0b"/>
    <circle cx="45" cy="75" r="14" fill="#ec4899"/>
  </g>

  <!-- Center Lightning Bolt -->
  <polygon points="260,250 236,295 256,295 244,340 284,288 264,288" fill="#34d399" filter="url(#iconGlow)"/>

  <!-- Brand name, no domain -->
  <text x="256" y="72" font-family="'Chakra Petch', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="6">
    THUÊTAB
  </text>
</svg>
